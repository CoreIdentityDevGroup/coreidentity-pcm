name: SDN Ingest (daily OFAC SDN list fetch)

# SDN sanctions screening design (docs/SDN-Sanctions-Screening-Design.md),
# piece 1. Triggers api/routes/scheduled.js's POST /sdn-ingest, which runs
# scripts/ofac-sdn-ingest.js's runIngest() inside pcm-api (already deployed
# inside the VPC with DB access) -- a GitHub-hosted runner cannot reach the
# RDS instance directly (confirmed live 2026-08-15: PubliclyAccessible is
# false), so this workflow calls the public HTTPS endpoint instead of
# connecting to the database itself. Same pattern already established for
# /monitoring (Phase 3.6).
#
# SCHEDULED, live as of 2026-08-15. This route now has its OWN dedicated
# key (PCM_SDN_INGEST_SCHEDULER_KEY), provisioned in Secrets Manager and
# wired into the live pcm-api task definition (revision 47) via a targeted,
# minimal AWS CLI update -- deliberately not /monitoring's shared key
# (authenticateScheduler.js was split into a per-route factory specifically
# so provisioning this route's key has zero effect on /monitoring's
# reachability, which stays 401/dark). Verified live before enabling the
# schedule below: the deployed pcm-api image SHA matches git HEAD exactly
# (nothing else moved), a direct curl against the real endpoint with the
# real key returned 200 with a real ingestion result, and the same key
# correctly still gets 401 against /monitoring.
#
# Daily at 09:00 UTC matches the design doc's ingestion cadence (piece 1)
# -- more frequent than OFAC actually publishes (observed cadence: 1-5 day
# gaps, see docs/SDN-Sanctions-Screening-Design.md piece 2), so this is
# about catching a fresh publication promptly, not fighting a faster
# upstream schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # daily, 09:00 UTC

env:
  SDN_INGEST_URL: https://api.coregenisis.com/api/v1/scheduled/sdn-ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SDN ingest
        run: |
          set -euo pipefail
          if [ -z "${PCM_SCHEDULER_API_KEY:-}" ]; then
            echo "FAIL: PCM_SCHEDULER_API_KEY secret not set on this repo yet -- see this file's header comment."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 120 \
            -X POST "$SDN_INGEST_URL" \
            -H "X-Scheduler-Api-Key: ${PCM_SCHEDULER_API_KEY}")
          echo "HTTP $code"
          cat /tmp/resp.json
          if [ "$code" != "200" ]; then
            echo "FAIL: sdn-ingest endpoint returned $code"
            exit 1
          fi
          echo "PASS: sdn-ingest completed"
        env:
          PCM_SCHEDULER_API_KEY: ${{ secrets.PCM_SCHEDULER_API_KEY }}
